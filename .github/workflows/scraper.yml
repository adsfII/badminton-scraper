name: Badminton Scraper

on:
  schedule:
    # 매일 한국시간 00시 (UTC 15시) 자동 실행
    - cron: '0 15 * * *'
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5      # v4 -> v5 업그레이드

      - uses: actions/setup-python@v6  # v5 -> v6 업그레이드
        with:
          python-version: '3.10'

      - run: pip install supabase requests

      - name: Run Python Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python main.py
